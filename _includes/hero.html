<!-- hero.html — the one signature bold element (AGENT_BRIEF.md §5): the real
     Agentic-SysID pendulum plant vs. identified model, styled as a two-channel
     readout in the signal/trace accent pair. prefers-reduced-motion swaps to a
     static frame; the play/pause control is real, not decorative. -->
<div class="hero-readout">
  <div class="hero-readout-frame">
    <video
      id="hero-pendulum-video"
      class="hero-readout-media"
      poster="{{ '/assets/img/systems/agentic-sysid-demo-frame.png' | relative_url }}"
      muted loop playsinline
      aria-label="Animation: the actual pendulum plant swinging alongside the white-box model identified by Agentic-SysID, tracking closely under composite excitation.">
      <source src="{{ '/assets/video/agentic-sysid-demo.mp4' | relative_url }}" type="video/mp4">
    </video>
    <button id="hero-pendulum-toggle" class="hero-readout-toggle" type="button" aria-label="Pause animation">
      <span aria-hidden="true">❚❚</span>
    </button>
  </div>
  <div class="hero-readout-caption">
    <span class="hero-channel hero-channel-signal">Actual plant</span>
    <span class="hero-channel hero-channel-trace">Identified model</span>
    <span class="hero-readout-note">Agentic-SysID, real run · <a href="{{ '/systems/#agentic-sysid' | relative_url }}">details →</a></span>
  </div>
</div>
