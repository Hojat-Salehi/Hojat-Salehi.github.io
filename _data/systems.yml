      url: https://github.com/Hojat-Salehi/game-analyst-multiagent

- key: ddim-time-series
  title: "DDIM Time Series"
  tagline: "Treating tomorrow's price movement as an image-inpainting problem"
  repo: https://github.com/Hojat-Salehi/DDIM_Time_Series

  problem: >
    Standard time-series forecasting models operate directly on numeric sequences.
    This asks a different question: can a stock's volume and price behavior be
    represented as an image instead, with each signal as a color channel — and can
    a diffusion model learn to fill in the missing channel, treating "predict the
    rest of the day's price movement" as conditional image generation rather than
    sequence forecasting.

  approach: >
    Each trading day is encoded as an RGB image: red is trading volume, green is
    price movement before a cutoff time (the conditioning signal), blue is price
    movement after the cutoff (the signal the model has to generate). A conditional
    UNet — attention blocks, sinusoidal time embeddings, skip connections — is
    trained as a denoising diffusion implicit model (DDIM). Only the blue channel is
    noised during training; red and green stay fixed as conditioning input. At
    inference, DDIM sampling reconstructs the blue channel from pure noise,
    conditioned on the red/green channels of a held-out test day.

  result: >
    Across the 9 evaluated test samples, the reconstructed post-cutoff (blue)
    channel reaches a mean squared error of ≈0.21 against the true channel (range
    ≈0.05–0.30 across samples) — the conditioning channels are reproduced exactly,
    as expected, and the generated channel lands closer-than-random but still noisy.
    Read as a proof-of-concept result, not a tuned forecasting benchmark.

  figures:
    - image: systems/ddim-comparison-sample0.png
      alt: >
        Side-by-side RGB-encoded trading day: original (red volume, green
        pre-cutoff price, blue post-cutoff price) versus the DDIM-generated
        version, where only the blue channel was reconstructed by the model.
      caption: >
        One held-out test day. Left: the true three-channel encoding (red =
        volume, green = price before the cutoff, blue = price after). Right: the
        same day with the blue channel regenerated by the diffusion model,
        conditioned on the red/green channels.
      source: "repos/DDIM_Time_Series/test_results/comparisons/sample_0.png"
    - image: systems/ddim-denoising-steps.png
      alt: >
        Twelve-step denoising trajectory: the blue (post-cutoff price) channel
        emerging from pure noise across DDIM sampling steps 0 through 11, while the
        red and green conditioning channels stay fixed throughout.
      caption: >
        The DDIM sampling trajectory for the same test day — the blue channel goes
        from pure noise (step 0) to the reconstructed price path (step 11) while
        red/green hold steady as conditioning.
      source: "repos/DDIM_Time_Series/test_results/intermediate_steps/sample_0_steps.png"

  artifact_links:
    - label: "Code"
      url: https://github.com/Hojat-Salehi/DDIM_Time_Series
