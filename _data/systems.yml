- key: corbinfl
  title: "CorBin-FL"
  tagline: "Differentially private federated learning, one bit per weight"
  repo: https://github.com/Hojat-Salehi/CorBin-FL
  paper: https://www.arxiv.org/abs/2409.13133

  problem: >
    Local differential privacy for federated learning usually means every client adds
    noise to its update independently. That noise doesn't cancel when the server
    averages updates across clients, so accuracy drops sharply at the privacy budgets
    (small ε) that matter in practice.

  approach: >
    CorBin-FL quantizes each client's update to a single bit per model weight, but
    draws the quantization noise from a shared source of randomness across clients
    instead of independent per-client noise. Each client still keeps its individual
    ε-LDP guarantee, but the noise is now negatively correlated, so it cancels out at
    the server instead of piling up.

  result: >
    On CIFAR-10 at ε = 1 (50 clients, 100 rounds, ResNet18), CorBin-FL reaches
    59.51% ± 0.24 test accuracy versus 44.23% ± 0.29 for the strongest 1-bit LDP
    baseline (LDPFL) — a 15-point gap at the same privacy budget and same
    communication cost. On FEMNIST at ε = 1, CorBin-FL reaches 82.82% ± 0.70 versus
    80.75% ± 0.04 for the strongest baseline (Laplace).

  figures:
    - image: systems/corbinfl-method-schematic.png
      alt: >
        Diagram of one CorBin-FL communication round in four stages: initialization,
        secure pairwise key exchange, model update with shared PRG seeds, and
        correlated-quantizer aggregation at the server.
      caption: >
        One communication round of CorBin-FL. The server broadcasts the global
        model and pairs up clients; each pair establishes a shared secret over an
        encrypted channel the server can't see; each client quantizes its own
        update to one bit using randomness drawn from that shared secret; the
        server averages the bits back into the new global model. Distinct pairs
        use independent shared randomness.
      source: "CorbinFL_paper/CorbinFL_Method.pdf, adapted from Fig. 1 of the paper"
    - image: systems/corbinfl-pca.png
      alt: >
        PCA projection of per-coordinate quantization error across model weight
        coordinates, comparing CorBin-FL's correlated binary quantization against
        independent binary quantization.
      caption: >
        PCA of the quantization error added to each weight coordinate. CorBin-FL's
        shared-randomness noise (left) concentrates tightly around zero and cancels
        out when the server aggregates client updates; independent per-client noise
        (right) spreads broadly and only partially cancels.
      source: "repos/CorBin-FL/README.md"

  table:
    caption: "1-bit-per-coordinate LDP baselines CorBin-FL is compared against"
    source: "repos/CorBin-FL/README.md"
    headers: ["Method", "Privacy", "Bits/coord", "Reference"]
    rows:
      - ["LDP-FL", "ε-LDP", "1", "Sun et al. 2020"]
      - ["I-MVU", "ε-LDP", "1 / 2 / 4", "Guo et al., ICML 2023"]
      - ["PBM-PLDP", "ε-PLDP", "1 / 2", "Privatized Binomial Mechanism"]
      - ["RQM", "ε-LDP", "1 / 2", "Youn et al. 2023"]
      - ["CorQuant", "None", "1", "Suresh et al. 2022"]
      - ["SignSGD", "None", "1", "Bernstein et al. 2019"]
      - ["FedAvg", "None", "32", "McMahan et al. 2016"]
      - ["Gaussian LDP", "ε-LDP", "32", "Balle & Wang 2018"]
      - ["Gaussian CDP", "ε-CDP", "32", "—"]
      - ["Laplace LDP", "ε-LDP", "32", "Dwork 2006"]

  artifact_links:
    - label: "Paper (arXiv)"
      url: https://www.arxiv.org/abs/2409.13133
    - label: "Code"
      url: https://github.com/Hojat-Salehi/CorBin-FL
    - label: "Try it"
      url: /demos/#corbin-privacy-explorer

- key: cpq-vehicular-frl
  title: "Private Vehicular FRL"
  tagline: "Federated reinforcement learning for vehicle routing — one private bit per parameter, post-quantum signed"
  repo: https://github.com/Hojat-Salehi/cpq-vehicular-frl
  paper: https://arxiv.org/abs/2610.41055

  problem: >
    Vehicles can learn a better routing policy together through federated reinforcement
    learning without ever centralizing their trajectories — but their model updates still
    leak where they came from, the wireless uplink to the road-side unit is narrow and
    lossy, and every update has to be authenticated against attackers who may one day
    have quantum computers. Adding independent privacy noise, full-precision updates, and
    post-quantum signatures on top of each other makes each of those problems worse.

  approach: >
    Correlated private quantization (CPQ) brings the CorBin-FL idea to the vehicular
    setting: paired vehicles quantize their deep-Q-network updates to one bit per
    parameter using shared randomness, so the privacy noise cancels at the road-side unit
    instead of piling up — with the same per-parameter privacy guarantee and the same
    one-bit cost as independent quantization. A tunable variant (CPQ-λ) mixes shared and
    independent randomness, and Rényi-DP accounting gives vector-level local privacy for an
    upload even when pairings are revealed. Updates are signed with ML-DSA-44, Falcon-512,
    or SLH-DSA, and the whole loop is co-simulated in SUMO (traffic) and ns-3 (packet-level
    IEEE 802.11p).

  result: >
    One-bit updates shrink the signed uplink from 113.76 KB to 8.65 KB with ML-DSA-44
    (92.4% smaller), which raises the mean number of verified updates aggregated per round
    from 19.6 to 26.5 over 802.11p. On that same channel at ε = 1, CPQ cuts mean travel time
    by 14.3% relative to independent quantization (167.0 s vs. 194.9 s), and under ideal communication at ε = 2 it reaches 118.6 s
    against 111.8 s with no privacy at all. At ε = 0.3, a vehicle-origin inference attack
    drops from 91% accuracy without privacy to 30% against CPQ (chance: 10%).

  figures:
    - image: systems/cpq-vfrl-architecture.png
      alt: >
        Architecture diagram: SUMO traffic simulation feeding N vehicle clients, each running
        local DQN training, a privacy mechanism (CPQ, CPQ-λ, LDP-FL, Gaussian, Laplace), and
        post-quantum signing; updates travel over an ns-3 simulated channel to a road-side
        unit that verifies signatures, reconstructs parameters, and aggregates.
      caption: >
        Each vehicle trains a DQN routing policy locally in SUMO, privatizes its update,
        and signs it with a post-quantum scheme. The road-side unit verifies every
        signature, rejects invalid updates, and aggregates the rest into the global model
        — with the V2I link itself simulated packet-by-packet in ns-3.
      source: "github.com/Hojat-Salehi/cpq-vehicular-frl docs/architecture.png (resized)"
    - image: systems/cpq-vfrl-learning-ideal.png
      alt: >
        Five-panel plot of mean trip duration versus federated aggregation round at privacy
        budgets 0.3, 0.5, 1, 2, and 5, comparing CPQ, CPQ-λ, LDP-FL, Gaussian, Laplace, and
        no privacy; CPQ tracks closest to the no-privacy curve at most budgets.
      caption: >
        Mean trip duration during training under ideal communication (lower is better).
        CPQ (solid blue) stays closest to the no-privacy curve across privacy budgets,
        while Gaussian noise at the same budget barely learns at ε = 0.3.
      source: "github.com/Hojat-Salehi/cpq-vehicular-frl docs/fig2_learning_ideal.png (Fig. 2 of the paper, resized)"

  table:
    caption: "Over 802.11p with ML-DSA-44 signatures at ε = 1 (mean of 5 seeds)"
    source: "github.com/Hojat-Salehi/cpq-vehicular-frl README.md, Main results"
    headers: ["Method", "Travel time (s)", "Arrival (%)", "Uplink delivered (%)", "Verified updates / round"]
    rows:
      - ["No privacy", "152.6", "80.4", "75.7", "19.6"]
      - ["CPQ", "167.0", "79.8", "99.4", "26.5"]
      - ["CPQ-λ (λ = 0.75)", "177.2", "75.8", "99.5", "26.1"]
      - ["LDP-FL", "194.9", "72.8", "99.4", "26.5"]
      - ["Gaussian", "290.3", "51.8", "74.0", "20.6"]
      - ["Laplace", "218.4", "66.4", "75.9", "20.4"]

  artifact_links:
    - label: "Paper (arXiv)"
      url: https://arxiv.org/abs/2610.41055
    - label: "Code"
      url: https://github.com/Hojat-Salehi/cpq-vehicular-frl
    - label: "Results archive (Zenodo)"
      url: https://doi.org/10.5281/zenodo.23693204

- key: agentic-sysid
  title: "Agentic-SysID"
  tagline: "A multi-agent pipeline that identifies control-ready models under an experiment budget"
  repo: https://github.com/Hojat-Salehi/Agentic-SysID

  problem: >
    Turning a physical plant into a control-ready model normally takes a control
    engineer manually designing experiments, fitting parameters, and validating the
    result by hand — and every experiment run against a real plant costs time and
    money, so the process can't just throw data at the problem.

  approach: >
    Agentic-SysID automates that workflow with a physics-first fidelity ladder of
    specialized agents. An Intake agent parses the plant description; a Modeler
    agent proposes the ODE structure and checks identifiability; an Estimator agent
    runs an excite-then-estimate loop to fit parameters; a Validation agent probes
    the fitted model adversarially. Only if validation finds the white-box model
    doesn't hold does the pipeline escalate — to a grey-box model (physics backbone
    plus a learned correction term) or, if the plant isn't modelable at all, to a
    black-box surrogate (GP / NARX / Neural ODE / SINDy). Every experiment is routed
    through a budgeted, safety-gated Plant API, so no agent can overspend or bypass
    the safety limits.

  result: >
    On the built-in pendulum benchmark, under composite step / low-frequency-sine /
    PRBS excitation, the pipeline's white-box model tracks the actual plant to
    10.05° RMSE (175 mrad) and identifies all three physical parameters within 1–3%
    of their true, hidden values (K_u: 20.000 → 20.571, +2.9%; K_d: 0.400 → 0.404,
    +1.0%; K_s: 29.430 → 29.943, +1.7%). Experiments-per-run and fidelity-ladder
    descent rate across a broader set of plants aren't tracked yet — clone it and
    point it at your own plant to find out.

  figures:
    - image: systems/agentic-sysid-flowchart.png
      alt: >
        Architecture diagram of Agentic-SysID: a centralized orchestrator routing
        between a white-box discovery phase, an adversarial validation phase, and
        grey-box / black-box escalation sub-orchestrators, all experiment calls
        passing through a guarded Plant API.
      caption: >
        Centralized coordination (orchestrator, budget manager, experiment
        registry) routes between four phases: white-box discovery and estimation,
        adversarial validation, and — only on evidence of a gap — grey-box or
        black-box escalation. All plant access goes through a single guarded,
        budgeted API.
      source: "repos/Agentic-SysID/demo/FlowChart.png"
    - image: systems/agentic-sysid-demo-frame.png
      alt: >
        Final frame of the pendulum demo: actual plant vs. identified white-box
        model swinging side by side under composite excitation, with an angle
        tracking plot and a per-parameter true-vs-identified comparison showing
        1-3% error.
      caption: >
        Actual pendulum (left) vs. the identified white-box model (right) under
        composite step/sine/PRBS excitation. Bottom: angle tracking (10.05° RMSE)
        and per-parameter accuracy against the true, hidden parameter values.
      source: "repos/Agentic-SysID/demo/demo.gif (last frame)"

  artifact_links:
    - label: "Code"
      url: https://github.com/Hojat-Salehi/Agentic-SysID
    - label: "Demo video"
      url: https://github.com/Hojat-Salehi/Agentic-SysID/blob/main/demo/demo.mp4

- key: game-analyst-multiagent
  title: "Game Analyst"
  tagline: "Adversarial multi-agent debate for NBA/MLB game analysis, graded against real outcomes"
  repo: https://github.com/Hojat-Salehi/game-analyst-multiagent

  problem: >
    A single LLM asked to predict a game's outcome tends to anchor on whatever
    narrative it reaches for first, with no mechanism to stress-test that call or
    check it against what actually happened.

  approach: >
    Game Analyst runs the question through two parallel adversarial debates — a
    Win Probability debate (Favorite Case vs. Underdog Case, argued purely from
    team stats, form, and head-to-head history, with no market odds involved) and a
    Total Points debate (High Total Case vs. Low Total Case, using the market's
    total-points number as one input among several) — each converging through a
    dedicated judge. A Head Analyst cross-validates both judges' reasoning for
    consistency and writes the final report. Every analysis persists to SQLite and
    renders to an HTML report; once a game completes, a post-game accuracy review
    compares the prediction to the real result and writes a lesson per agent role
    into a ChromaDB memory store, so later analyses of similar situations draw on
    what past predictions got right or wrong.

  result: >
    The system is built to grade itself — every analysis persists to SQLite, and a
    post-game review compares each prediction to the actual final score once the
    game completes (see `database/schema.sql`). One real recorded run is up on the
    <a href="/demos/#game-analyst-replay">Demos</a> page — Royals @ Tigers, MLB,
    predicted Detroit at 63%, the Royals won 3–2 — but one game isn't a track
    record. No accuracy number to report until more real runs accumulate.

  figures:
    - image: systems/game-analyst-architecture.png
      alt: >
        Architecture diagram: Home/Away Team Analysts and H2H Analyst feed a Market
        Reference Analyst, which drives two parallel adversarial debates (Win
        Probability: Favorite vs. Underdog; Total Points: High vs. Low Total), each
        resolved by a judge, cross-validated by a Head Analyst into a final report,
        which after the game completes triggers a Post-Game Accuracy Review.
      caption: >
        Two adversarial debates run in parallel — win probability and total
        points — each resolved by a dedicated judge. The Head Analyst
        cross-validates both before writing the final report. Re-rendered with
        Graphviz from the Mermaid diagram in the repo's own README (this site has
        no server-side Mermaid renderer); structure and labels are unchanged.
      source: "repos/game-analyst-multiagent/README.md (Mermaid source, re-rendered)"

  artifact_links:
    - label: "Code"
      url: https://github.com/Hojat-Salehi/game-analyst-multiagent
    - label: "Watch the replay"
      url: /demos/#game-analyst-replay

- key: ddim-time-series
  title: "DDIM Time Series"
  tagline: "Treating tomorrow's price movement as an image-inpainting problem"
  repo: https://github.com/Hojat-Salehi/DDIM_Time_Series

  problem: >
    Standard time-series forecasting models operate directly on numeric sequences.
    This asks a different question: can a stock's volume and price behavior be
    represented as an image instead, with each signal as a color channel — and can
    a diffusion model learn to fill in the missing channel, treating "predict the
    rest of the day's price movement" as conditional image generation rather than
    sequence forecasting.

  approach: >
    Each trading day is encoded as an RGB image: red is trading volume, green is
    price movement before a cutoff time (the conditioning signal), blue is price
    movement after the cutoff (the signal the model has to generate). A conditional
    UNet — attention blocks, sinusoidal time embeddings, skip connections — is
    trained as a denoising diffusion implicit model (DDIM). Only the blue channel is
    noised during training; red and green stay fixed as conditioning input. At
    inference, DDIM sampling reconstructs the blue channel from pure noise,
    conditioned on the red/green channels of a held-out test day.

  result: >
    Across the 9 evaluated test samples, the reconstructed post-cutoff (blue)
    channel reaches a mean squared error of ≈0.21 against the true channel (range
    ≈0.05–0.30 across samples) — the conditioning channels are reproduced exactly,
    as expected, and the generated channel lands closer-than-random but still noisy.
    Read as a proof-of-concept result, not a tuned forecasting benchmark.

  figures:
    - image: systems/ddim-comparison-sample0.png
      alt: >
        Side-by-side RGB-encoded trading day: original (red volume, green
        pre-cutoff price, blue post-cutoff price) versus the DDIM-generated
        version, where only the blue channel was reconstructed by the model.
      caption: >
        One held-out test day. Left: the true three-channel encoding (red =
        volume, green = price before the cutoff, blue = price after). Right: the
        same day with the blue channel regenerated by the diffusion model,
        conditioned on the red/green channels.
      source: "repos/DDIM_Time_Series/test_results/comparisons/sample_0.png"
    - image: systems/ddim-denoising-steps.png
      alt: >
        Twelve-step denoising trajectory: the blue (post-cutoff price) channel
        emerging from pure noise across DDIM sampling steps 0 through 11, while the
        red and green conditioning channels stay fixed throughout.
      caption: >
        The DDIM sampling trajectory for the same test day — the blue channel goes
        from pure noise (step 0) to the reconstructed price path (step 11) while
        red/green hold steady as conditioning.
      source: "repos/DDIM_Time_Series/test_results/intermediate_steps/sample_0_steps.png"

  artifact_links:
    - label: "Code"
      url: https://github.com/Hojat-Salehi/DDIM_Time_Series
