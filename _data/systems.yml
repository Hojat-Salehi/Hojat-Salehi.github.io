- key: corbinfl
  title: "CorBin-FL"
  tagline: "Differentially private federated learning, one bit per weight"
  repo: https://github.com/Hojat-Salehi/CorBin-FL
  paper: https://www.arxiv.org/abs/2409.13133

  problem: >
    Local differential privacy for federated learning usually means every client adds
    noise to its update independently. That noise doesn't cancel when the server
    averages updates across clients, so accuracy drops sharply at the privacy budgets
    (small ε) that matter in practice.

  approach: >
    CorBin-FL quantizes each client's update to a single bit per model weight, but
    draws the quantization noise from a shared source of randomness across clients
    instead of independent per-client noise. Each client still keeps its individual
    ε-LDP guarantee, but the noise is now negatively correlated, so it cancels out at
    the server instead of piling up.

  result: >
    On CIFAR-10 at ε = 1 (50 clients, 100 rounds, ResNet18), CorBin-FL reaches
    59.51% ± 0.24 test accuracy versus 44.23% ± 0.29 for the strongest 1-bit LDP
    baseline (LDPFL) — a 15-point gap at the same privacy budget and same
    communication cost. On FEMNIST at ε = 1, CorBin-FL reaches 82.82% ± 0.70 versus
    80.75% ± 0.04 for the strongest baseline (Laplace).

  figures:
    - image: systems/corbinfl-method-schematic.png
      alt: >
        Diagram of one CorBin-FL communication round in four stages: initialization,
        secure pairwise key exchange, model update with shared PRG seeds, and
        correlated-quantizer aggregation at the server.
      caption: >
        One communication round of CorBin-FL. The server broadcasts the global
        model and pairs up clients; each pair establishes a shared secret over an
        encrypted channel the server can't see; each client quantizes its own
        update to one bit using randomness drawn from that shared secret; the
        server averages the bits back into the new global model. Distinct pairs
        use independent shared randomness.
      source: "CorbinFL_paper/CorbinFL_Method.pdf, adapted from Fig. 1 of the paper"
    - image: systems/corbinfl-pca.png
      alt: >
        PCA projection of per-coordinate quantization error across model weight
        coordinates, comparing CorBin-FL's correlated binary quantization against
        independent binary quantization.
      caption: >
        PCA of the quantization error added to each weight coordinate. CorBin-FL's
        shared-randomness noise (left) concentrates tightly around zero and cancels
        out when the server aggregates client updates; independent per-client noise
        (right) spreads broadly and only partially cancels.
      source: "repos/CorBin-FL/README.md"

  table:
    caption: "1-bit-per-coordinate LDP baselines CorBin-FL is compared against"
    source: "repos/CorBin-FL/README.md"
    headers: ["Method", "Privacy", "Bits/coord", "Reference"]
    rows:
      - ["LDP-FL", "ε-LDP", "1", "Sun et al. 2020"]
      - ["I-MVU", "ε-LDP", "1 / 2 / 4", "Guo et al., ICML 2023"]
      - ["PBM-PLDP", "ε-PLDP", "1 / 2", "Privatized Binomial Mechanism"]
      - ["RQM", "ε-LDP", "1 / 2", "Youn et al. 2023"]
      - ["CorQuant", "None", "1", "Suresh et al. 2022"]
      - ["SignSGD", "None", "1", "Bernstein et al. 2019"]
      - ["FedAvg", "None", "32", "McMahan et al. 2016"]
      - ["Gaussian LDP", "ε-LDP", "32", "Balle & Wang 2018"]
      - ["Gaussian CDP", "ε-CDP", "32", "—"]
      - ["Laplace LDP", "ε-LDP", "32", "Dwork 2006"]

  artifact_links:
    - label: "Paper (arXiv)"
      url: https://www.arxiv.org/abs/2409.13133
    - label: "Code"
      url: https://github.com/Hojat-Salehi/CorBin-FL

- key: agentic-sysid
  title: "Agentic-SysID"
  tagline: "A multi-agent pipeline that identifies control-ready models under an experiment budget"
  repo: https://github.com/Hojat-Salehi/Agentic-SysID

  problem: >
    Turning a physical plant into a control-ready model normally takes a control
    engineer manually designing experiments, fitting parameters, and validating the
    result by hand — and every experiment run against a real plant costs time and
    money, so the process can't just throw data at the problem.

  approach: >
    Agentic-SysID automates that workflow with a physics-first fidelity ladder of
    specialized agents. An Intake agent parses the plant description; a Modeler
    agent proposes the ODE structure and checks identifiability; an Estimator agent
    runs an excite-then-estimate loop to fit parameters; a Validation agent probes
    the fitted model adversarially. Only if validation finds the white-box model
    doesn't hold does the pipeline escalate — to a grey-box model (physics backbone
    plus a learned correction term) or, if the plant isn't modelable at all, to a
    black-box surrogate (GP / NARX / Neural ODE / SINDy). Every experiment is routed
    through a budgeted, safety-gated Plant API, so no agent can overspend or bypass
    the safety limits.

  result: >
    On the built-in pendulum benchmark, under composite step / low-frequency-sine /
    PRBS excitation, the pipeline's white-box model tracks the actual plant to
    10.05° RMSE (175 mrad) and identifies all three physical parameters within 1–3%
    of their true, hidden values (K_u: 20.000 → 20.571, +2.9%; K_d: 0.400 → 0.404,
    +1.0%; K_s: 29.430 → 29.943, +1.7%). [TK — experiments consumed per run, and how
    often the fidelity ladder descends past white-box across a broader set of plants:
    the run logs that would answer this live in a local, gitignored experiment
    database that isn't in this clone. See QUESTIONS.md.]

  figures:
    - image: systems/agentic-sysid-flowchart.png
      alt: >
        Architecture diagram of Agentic-SysID: a centralized orchestrator routing
        between a white-box discovery phase, an adversarial validation phase, and
        grey-box / black-box escalation sub-orchestrators, all experiment calls
        passing through a guarded Plant API.
      caption: >
        Centralized coordination (orchestrator, budget manager, experiment
        registry) routes between four phases: white-box discovery and estimation,
        adversarial validation, and — only on evidence of a gap — grey-box or
        black-box escalation. All plant access goes through a single guarded,
        budgeted API.
      source: "repos/Agentic-SysID/demo/FlowChart.png"
    - image: systems/agentic-sysid-demo-frame.png
      alt: >
        Final frame of the pendulum demo: actual plant vs. identified white-box
        model swinging side by side under composite excitation, with an angle
        tracking plot and a per-parameter true-vs-identified comparison showing
        1-3% error.
      caption: >
        Actual pendulum (left) vs. the identified white-box model (right) under
        composite step/sine/PRBS excitation. Bottom: angle tracking (10.05° RMSE)
        and per-parameter accuracy against the true, hidden parameter values.
      source: "repos/Agentic-SysID/demo/demo.gif (last frame)"

  artifact_links:
    - label: "Code"
      url: https://github.com/Hojat-Salehi/Agentic-SysID
    - label: "Demo video"
      url: https://github.com/Hojat-Salehi/Agentic-SysID/blob/main/demo/demo.mp4

- key: game-analyst-multiagent
  title: "Game Analyst"
  tagline: "Adversarial multi-agent debate for NBA/MLB game analysis, graded against real outcomes"
  repo: https://github.com/Hojat-Salehi/game-analyst-multiagent

  problem: >
    A single LLM asked to predict a game's outcome tends to anchor on whatever
    narrative it reaches for first, with no mechanism to stress-test that call or
    check it against what actually happened.

  approach: >
    Game Analyst runs the question through two parallel adversarial debates — a
    Win Probability debate (Favorite Case vs. Underdog Case, argued purely from
    team stats, form, and head-to-head history, with no market odds involved) and a
    Total Points debate (High Total Case vs. Low Total Case, using the market's
    total-points number as one input among several) — each converging through a
    dedicated judge. A Head Analyst cross-validates both judges' reasoning for
    consistency and writes the final report. Every analysis persists to SQLite and
    renders to an HTML report; once a game completes, a post-game accuracy review
    compares the prediction to the real result and writes a lesson per agent role
    into a ChromaDB memory store, so later analyses of similar situations draw on
    what past predictions got right or wrong.

  result: >
    [TK — measured prediction accuracy over N games. The system is built to grade
    itself: `game_analysis.db` stores every prediction and `review_result` compares
    it to the actual final score once the game completes (see `database/schema.sql`
    and the Post-Game Accuracy Review step). But this repo clone has no populated
    database or `reports/` directory — both are gitignored, runtime-generated, and
    empty until real games are run through it. This is the biggest gap on this
    entire site: there's no track record yet. See QUESTIONS.md — the fix is to
    start running it against real, currently-scheduled games now, so a real number
    exists here by interview season.]

  figures:
    - image: systems/game-analyst-architecture.png
      alt: >
        Architecture diagram: Home/Away Team Analysts and H2H Analyst feed a Market
        Reference Analyst, which drives two parallel adversarial debates (Win
        Probability: Favorite vs. Underdog; Total Points: High vs. Low Total), each
        resolved by a judge, cross-validated by a Head Analyst into a final report,
        which after the game completes triggers a Post-Game Accuracy Review.
      caption: >
        Two adversarial debates run in parallel — win probability and total
        points — each resolved by a dedicated judge. The Head Analyst
        cross-validates both before writing the final report. Re-rendered with
        Graphviz from the Mermaid diagram in the repo's own README (this site has
        no server-side Mermaid renderer); structure and labels are unchanged.
      source: "repos/game-analyst-multiagent/README.md (Mermaid source, re-rendered)"

  artifact_links:
