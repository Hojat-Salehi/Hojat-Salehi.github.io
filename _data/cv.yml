- title: Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: Florida International University
      year: Aug 2023 – present
      description:
        - title: "Maximally Negatively Correlated Quantizers in Distributed Learning (CorBin-FL)"
          contents:
            - "Introduced correlated distributed quantization for federated learning, improving accuracy over prior methods."
            - "Validated on CIFAR10, FEMNIST, Shakespeare, and Sent140 (CNN, ResNet18, LSTM, Transformer) on multiple A100s, achieving high communication efficiency by transmitting one bit per model weight."
        - title: "Private Federated RL with Post-Quantum Authentication for Vehicular Networks"
          contents:
            - "Extended correlated private quantization to federated deep Q-learning for vehicle routing, co-simulated in SUMO and ns-3 (IEEE 802.11p) with post-quantum signatures (ML-DSA, Falcon, SLH-DSA)."
            - "One-bit updates cut the signed uplink by 92.4% and reduced mean travel time by 14.3% versus independent quantization at the same privacy budget."
        - title: "Mixture of LoRA Experts for Foundation-Model Fine-Tuning (FedSEE)"
          contents:
            - "Proved when routing between task-specialized LoRA experts beats any single adapted model for data mixing several tasks (task optima forming a simplex), and derived a convex program that recovers the experts from mixed model updates."
            - "Fine-tuned RoBERTa-large on six GLUE/SuperGLUE tasks with a mixture-aware, KL-calibrated router across clients with different task mixes: +2.9 points accuracy overall and +3.7 for the worst-served quarter of clients, avoiding baselines' negative transfer."
        - title: "Explanation-Preserving Augmentation for Semi-Supervised Graph Representation Learning"
          contents:
            - "Developed a semantics-preserving graph augmentation technique leveraging GNN explainers, with theoretical analysis of its gains over prior methods."
            - "Validated on MUTAG, Benzene, and PROTEINS, achieving up to 7.83% improvement in classification accuracy."
        - title: "Discrete Denoising Diffusion Model (DiGress) and Application in Graph Explainability"
          contents:
            - "Applied Discrete Denoising Diffusion (DiGress) to ProxyExplainer to improve GNN explainer accuracy."
            - "Conditioned the diffusion model on explainer subgraphs to enable in-distribution graph generation, preserving explainable structure while reconstructing the rest."
        - title: "Denoising Diffusion Implicit Model (DDIM) for Time Series Prediction"
          contents:
            - "Developed a conditional DDIM with an attention-based UNet for time-series analysis and generation."
            - "Encoded volume and price movements as multi-channel RGB conditioning to capture temporal dependencies."
