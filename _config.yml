# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # the website title (if blank, full name will be used instead)
first_name: Hojat Allah   # canonical name — matches publications; used in footer copyright, meta author, JSON-LD schema
last_name: Salehi
display_name: Hojat Salehi   # display alias — used in the H1, nav brand, and browser tab title (brief §8 distinguishes these)
email: hsalehi@fiu.edu
description: >
  Hojat Allah Salehi — information theory in machine learning, explainable AI, and agentic systems.
  PhD candidate, Florida International University.
footer_text: >
  © Hojat Allah Salehi. Built with <a href="https://jekyllrb.com/" target="_blank">Jekyll</a>,
  hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
keywords: Hojat Salehi, Hojat Allah Salehi, information theory, differential privacy, federated learning, explainable AI, agentic AI, graph neural networks

lang: en # the language of your site (for example: en, fr, cn, ru, etc.)
icon: favicon.png  # site.icon gets '/assets/img/' prepended automatically — don't include the folder here

url: https://hojat-salehi.github.io # base hostname; swap to https://hojatsalehi.com if/when the domain is purchased (principal: staying on github.io for now)
baseurl: # empty: this is a <username>.github.io user site, served at the domain root, not a project subpath
last_updated: false # set to true if you want to display last updated in the footer
impressum_path:  # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# code highlighter theme
highlight_theme_light: github   # https://github.com/jwarby/jekyll-pygments-themes
highlight_theme_dark: native    # https://github.com/jwarby/jekyll-pygments-themes

# repo color theme
repo_theme_light: default       # https://github.com/anuraghazra/github-readme-stats/blob/master/themes/README.md
repo_theme_dark: dark           # https://github.com/anuraghazra/github-readme-stats/blob/master/themes/README.md
repo_trophies:
  enabled: true
  theme_light: flat    # https://github.com/ryo-ma/github-profile-trophy
  theme_dark: gitdimmed  # https://github.com/ryo-ma/github-profile-trophy

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------
# will use title and url fields
# Take a look to https://github.com/jekyll/jekyll-feed for more customization

rss_icon: false # no Notes blog content yet (Phase 4) — re-enable once there's something to subscribe to

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true

# Dimensions
max_width: 1040px # wider on laptop/desktop; this only caps the upper bound, so mobile is unaffected (viewport is always narrower than this anyway)

# TODO: add layout settings (single page vs. multi-page)

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
# Display links to the page with a preview object on social media.
serve_og_meta: true # Include Open Graph meta tags in the HTML head
serve_schema_org: true # Include Schema.org in the HTML head (JSON-LD Person schema, per brief §8)
og_image: https://hojat-salehi.github.io/assets/img/og-image.png # must be an absolute URL — og:image isn't relative_url-resolved. Update this if the domain changes.

