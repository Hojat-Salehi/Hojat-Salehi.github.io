  Email is the most reliable way to reach me.

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------

google_analytics:  # your Google Analytics measurement ID (format: G-XXXXXXXXXX)
panelbear_analytics:  # panelbear analytics site ID (format: XXXXXXXXX)

google_site_verification:  # your google-site-verification ID (Google Search Console)
bing_site_verification:  # out your bing-site-verification ID (Bing Webmaster)

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: Notes # displayed in the blog page
blog_nav_title: # blank on purpose: no nav item until real posts exist — brief §6.5 is Phase 4, principal writes these
blog_description: Notes on the papers and systems above, in plain language.
permalink: /blog/:year/:title/

# Pagination
pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

# Comments disabled for now — al-folio's default Giscus config points at the al-folio repo itself,
# which must never be left in place. Revisit if/when comments are wanted (not required by the brief).
giscus:
  repo:
  repo_id:
  category:
  category_id:
  mapping: title
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  theme: preferred_color_scheme
  emit_metadata: 0
  lang: en

disqus_shortname: # left blank — deprecated, not used

external_sources:

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
news_scrollable: true # adds a vertical scroll bar if there are more than 3 news items
news_limit: 5 # leave blank to include all the news in the `_news` folder

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ['_pages']
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
  - NOTES.md
  - QUESTIONS.md
  - README.md
  - LICENSE
keep_files:
  - CNAME
  - .nojekyll
  - .git

# Plug-ins — trimmed to what this site actually uses (brief: no unneeded bloat)
plugins:
  - jekyll-feed        # RSS for the Notes blog, brief §6.5
  - jekyll/scholar      # BibTeX-driven Publications page, single source of truth per brief §6.1
  - jekyll-sitemap     # sitemap.xml, brief §8

# Sitemap settings
defaults:
  - scope:
      path: "assets/**/*.*"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:

  last_name: [Salehi]
  first_name: [Hojat Allah, Hojat A., H. A.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  # Note: if you have latex math in your bibtex, the latex filter
  # preprocessing may conflict with MathJAX if the latter is enabled.
  # See https://github.com/alshedivat/al-folio/issues/357.
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

badges: # Display different badges for your pulications
  altmetric_badge: false # kept quiet per brief §5 — no unnecessary badges/decoration
  dimensions_badge: false

# Filter out certain bibtex entry keywords used internally from the bib output
filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview, altmetric]

# Maximum number of authors to be shown for each publication (more authors are visible on click)
max_author_limit: 3  # leave blank to always show all authors
more_authors_animation_delay: 10  # more authors are revealed on click using animation; smaller delay means faster animation


# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics:    false  # enables google analytics
enable_panelbear_analytics: false  # enables panelbear analytics
enable_google_verification: false  # enables google site verification
enable_bing_verification:   false  # enables bing site verification
enable_masonry:             false  # not using a project-card grid — brief §5 explicitly avoids the generic card-grid pattern
enable_math:                true   # MathJax, for information-theory notation on the Research page (Phase 2)
enable_tooltips:            false
enable_darkmode:            true   # brief §5: light mode is default and must be the well-designed one; dark mode optional
enable_navbar_social:       true   # Scholar / GitHub / LinkedIn in the nav, per brief §6.1 home page spec
enable_project_categories:  false
enable_medium_zoom:         false  # no image-zoom gimmick — brief §5 wants motion to serve content, not decorate
enable_progressbar:         false  # no scroll progress bar — same reasoning

